apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperatlas-net-ingress
  namespace: paperatlas-dz
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: paperatlas-dz-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - paperatlas.net
        - www.paperatlas.net
      secretName: paperatlas-net-tls
  rules:
    - host: paperatlas.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: www.paperatlas.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
